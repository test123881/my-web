<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>上表头盒子示例</title>
  <style>
    .panel {
      width: 420px;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }

    .panel__header {
      background-color: #4068b6;
      color: white;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: bold;
    }

    .panel__body {
      padding: 16px;
      background-color: #ffffff;
    }
  </style>
</head>

<body>
  <div class="panel">
    <div class="panel__header">
      留言表单
    </div>
    <div class="panel__body">
      姓名：<input type="text"><br><br>
      邮箱：<input type="email"><br><br>
      留言：<br>
      <textarea rows="4" cols="30"></textarea><br><br>
      <input type="submit" value="提交">
    </div>
  </div>
</body>

</html>
